services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_dev_password   # dev only; use a secrets manager in production
      POSTGRES_DB: support
    ports:
      - "5433:5432"   # host port 5433: a Postgres already installed on Windows often owns 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
volumes:
  pg_data:
